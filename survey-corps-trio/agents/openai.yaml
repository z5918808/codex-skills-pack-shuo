interface:
  display_name: "Survey Corps Trio"
  short_description: "調查兵團：Erwin 定方向、Hange 調度修復、Levi 執行"
  default_prompt: "使用 $survey-corps-trio：Astra／Erwin 先研究並定框架、權限與驗收；Hange／Sol medium 負責日常規劃、派工、審查與修復，Levi／Luna max 只執行明確步驟，成果和錯誤回 Hange。Hange 與 Levi 自行接力，Erwin 的判斷能減少試錯、解開重要疑慮或改善方案時，可提早帶具體問題請教，不必等失敗，也不為省 token 刻意繞過；方向變更、反覆卡關、真正阻擋與整體驗收交 Erwin；已知研究或除錯直接由 Hange 做，不等三次試錯。Astra 帶隊可 medium，實作及自審僅 low；自己的成果自己審。正常工作順便校準，不加評分回合。回報末尾向實際接收者問「依整體目標與目前進度，我下一步應完成哪個具體成果？」。保留單一寫入者、live 權限及停止規則；DUO 不套用此三角色流程。"

policy:
  allow_implicit_invocation: false
