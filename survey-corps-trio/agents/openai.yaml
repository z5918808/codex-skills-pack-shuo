interface:
  display_name: "Survey Corps Trio"
  short_description: "調查兵團：Erwin 定方向、Hange 判斷驗收、Levi 完整執行"
  default_prompt: "使用 $survey-corps-trio：Astra／Erwin 先研究並定框架、權限與驗收；大型跨模組、全局拓樸或跨領域分析先由 Astra 規劃，Hange 深化局部，不先做整體再重做，也不因此升推理強度；Hange／Sol medium 用拆解、示例、判斷規則與驗收引導 Levi，可明確交辦的工作優先由 Levi 完成，Levi／Luna max 只執行明確步驟，成果和錯誤回 Hange。Hange 與 Levi 自行接力，Erwin 的判斷能減少試錯、解開重要疑慮或改善方案時，可提早帶具體問題請教，不必等失敗，也不為省 token 刻意繞過；方向變更、反覆卡關、真正阻擋與整體驗收交 Erwin；Hange 只處理未解判斷與診斷；修法確定後，程式修改、adapter、指定測試及證據整理交 Levi 一段完成，成功的內部檢查不逐步叫回 Hange。Hange 僅在交辦更費事的已知小修才直接動手，不擴成整套實作；沿用既有規則，只補差異，不預先寫完整答案。段落驗收讀完整覆蓋與關鍵證據，按例外深入，不重做已過工作；不能用摘要或抽樣代替必要證明。Astra 帶隊可 medium，實作及自審僅 low；自己的成果自己審。正常工作順便校準，不加評分回合。Hange 結束前若整體目標未完、沒有已派出的後續工作或已送出待答回報，須實際回報 Erwin，不得無聲停止；已送出不重送，停止指示優先。回報問句依 reporting 規則；請教只問具體問題，不結束原任務，回覆綁定原問題與版本後直接接續。保留單一寫入者、live 權限及停止規則；DUO 不套用此三角色流程。"

policy:
  allow_implicit_invocation: false
