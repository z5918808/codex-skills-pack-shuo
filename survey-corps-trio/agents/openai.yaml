interface:
  display_name: "Survey Corps Trio"
  short_description: "調查兵團：Erwin 主導與自審、Hange 按需協作、Levi 執行"
  default_prompt: "使用 $survey-corps-trio：Astra 主導方向，一般協作預設 low、可用 medium；單幹、接手實作及自審只能 low，先核對實際設定。以完成品質的總成本分工，Sol medium 按需研究修復，Luna max 執行授權任務；不強迫往返。Astra 做的工作只由同一 Astra 自審並完成必要測試，不交其他角色審查。接手先核對單一寫入者，保留 live 權限邊界。Sol／Levi 回報結尾加「請指示下一步。」。"

policy:
  allow_implicit_invocation: false
