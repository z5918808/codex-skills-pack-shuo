interface:
  display_name: "Trio Long Running"
  short_description: "預設 Sol medium 主持、Astra medium 顧問、Luna max 執行"
  default_prompt: "使用 $trio-long-running，建議預設 Sol medium 主對話、Astra medium Thinker、Luna max Worker，但保留目前所選主對話模型與推理強度；Sol 主對話預設配 Astra medium，Astra 主對話配 Sol high。顧問推理強度可由使用者明確指定，三個角色各用獨立 Codex 對話，禁止 subagents，以直接訊息回報，Sol 以原始目標、事實、假設、脈絡陷阱、優先事項與最早共同原因的短格式交棒；Astra 直接做開場釐清與重大重思，不必另讀 step-back-and-think；Sol 負責推進、修正及一般 Worker 成果驗收。高風險、證據衝突、重複失敗原因未解、重大判斷未解或明訂要求時，才交同一 Astra 審查相關範圍；保留必要證據，不得越過 Astra 未解決的否決或既有綁定要求。"
